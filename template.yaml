},"chartOptions":{"view":"line","plotOptions":{"legend":{"show":true,"position":"bottom"},"yAxis":[{"min":0,"title":"requests per step"}]}}},"description":"Read against goodput: when this rises and goodput falls, the ceiling is past the knee","layout":{"x":0,"y":12148,"w":60,"h":380}},{"type":"markdown","variant":"transparent","layout":{"x":0,"y":12528,"w":60,"h":80},"config":{"content":"# Appendix: when it breaks, isolate the device, not the instance\n\n---"}},{"type":"markdown","variant":"transparent","config":{"content":"**Read the fault hierarchy in order, quietly degraded to failed:** throttling and clock drops, then correctable memory errors, then uncorrectable errors and row remapping, then Xid. Throttling with falling tokens per second is a cooling or power limit, not a failure. Correctable errors are a warning (watch the trend); **uncorrectable is terminal: cordon and replace.** Where the code allows, **reset the one GPU**: cycling a p5.48xlarge for one fault takes seven healthy H100s (~$48/h) down with it. Verify the fix cleared the signal it was raised for. Collective-communication health is in logs and traces only; there is no metric."},"layout":{"x":0,"y":12608,"w":60,"h":128}},{"type":"explore","title":"1. SM clock (MHz): drops = throttling","config":{"queryString":"sum without (\"@resource.k8s.namespace.name\", \"@resource.k8s.deployment.name\", \"@resource.host.type\") (label_replace(label_replace(sum without (\"modelName\", \"@resource.host.type\") (label_replace(label_replace(label_join(label_replace(avg by (\"@resource.k8s.namespace.name\", \"modelName\", \"gpu\", \"@resource.host.type\") ({\"DCGM_FI_DEV_SM_CLOCK\", \"@resource.k8s.cluster.name\"=\"${ClusterName}\"}), \"Team\", \"unowned\", \"@resource.k8s.namespace.name\", \"\"), \"gpu\", \" #\", \"modelName\", \"gpu\"), \"gpu\", \"$1\", \"gpu\", \"NVIDIA (.*)\"), \"instance\", \"$1\", \"@resource.host.type\", \"(.*)\")), \"Team\", \"$1\", \"@resource.k8s.namespace.name\", \"(.+)\"), \"instance\"