esource.host.type\") (label_replace(label_replace(sum without (\"modelName\", \"@resource.host.type\") (label_replace(label_replace(label_join(label_replace(label_replace(max by (\"@resource.k8s.namespace.name\", \"modelName\", \"gpu\", \"@resource.host.type\") ({\"DCGM_FI_DEV_ECC_SBE_VOL_TOTAL\", \"@resource.k8s.cluster.name\"=\"${ClusterName}\"}), \"signal\", \"correctable (SBE)\", \"\", \"\") or label_replace(max by (\"@resource.k8s.namespace.name\", \"modelName\", \"gpu\", \"@resource.host.type\") ({\"DCGM_FI_DEV_ECC_DBE_VOL_TOTAL\", \"@resource.k8s.cluster.name\"=\"${ClusterName}\"}), \"signal\", \"uncorrectable (DBE): cordon and replace\", \"\", \"\"), \"Team\", \"unowned\", \"@resource.k8s.namespace.name\", \"\"), \"gpu\", \" #\", \"modelName\", \"gpu\"), \"gpu\", \"$1\", \"gpu\", \"NVIDIA (.*)\"), \"instance\", \"$1\", \"@resource.host.type\", \"(.*)\")), \"Team\", \"$1\", \"@resource.k8s.namespace.name\", \"(.+)\"), \"instance\", \"$1\", \"@resource.host.type\", \"(.+)\"))","queryLanguage":"promql","visualization":"line","autoRun":true,"promqlQueryOptions":{"step":60},"chartOptions":{"view":"line","plotOptions":{"legend":{"show":true,"position":"bottom"},"yAxis":[{"min":0,"title":"errors"}]}}},"layout":{"x":0,"y":13496,"w":60,"h":380}},{"type":"markdown","variant":"transparent","config":{"content":"**Not every Xid means broken hardware** (31 codes in the catalog):\n\n- **Reset the GPU or reboot (17):** 46 48 62 64 79 95 109 110 119 120 136 140 143 151 155 156 158\n- **Investigate (6):** 45 54 61 74 142 154\n- **Fix your application (5):** 13 31 68 69 94: usually an illegal memory access; replacing hardware changes nothing\n- **Ignore (3):** 43 63 92\n\n`DCGM_FI_DEV_XID_ERRORS` and the remapped-row fields are not in the add-on's default DCGM field set; Xid events are in the node's kernel log (EKS node monitoring agent)."},"layout":{"x":0,"y":13876,"w":60,"h":226}},{"type":"markdown","variant":"transparent","config":{"content":"### Over-provisioned? Partition the GPU\nMulti-Instance GPU splits one A100 or H100 into up to **seven** partitions with dedicated multiprocessors, memory and bandwidth: the only sharing mode that attributes a regression to one tenant (time-slicing and MPS report per device). **Never co-locate two workloads with latency targets on a mode that cannot attribute a regression.** Trade-off: `GPU_UTIL` does not report MIG devices, so use occupancy (a profiling field, off by default)."},"layout":{"x":0,"y":14102,"w":60,"h":142}},{"type":"markdown","variant":"transparent","config":{"content":"### Trainium and Inferentia\n**Queue, Owner, goodput and cost per token transfer unchanged** (vLLM on Neuron reports the same running, waiting and cache numbers). **Device does not:** `neuron_core_utilization_avg` measures the NeuronCore (the multiprocessor's counterpart), not the Tensor Engine, so busy-vs-working cannot be drawn, and there is no bandwidth counter: classify by output:input ratio, then host vs device time at low batch. Neuron compiles static shapes, so **padding** is a waste category: set bucket boundaries from your measured length distribution (section 5). No Xid: four kernel-log hardware errors, EKS replaces the node."},"layout":{"x":0,"y":14244,"w":60,"h":168}},{"type":"markdown","variant":"transparent","config":{"content":"### Queries return nothing?\n- DCGM renamed profiling fields (IDs unchanged): `PROF_TENSOR_UTIL_RATIO` was `PIPE_TENSOR_ACTIVE` (1004), `PROF_SM_UTIL_RATIO` was `SM_ACTIVE` (1002), `PROF_DRAM_UTIL_RATIO` was `DRAM_ACTIVE` (1005).\n- Profiling fields are **off by default**; sampling too fast returns **zeroes**, not nothing.\n- Accelerated Compute Insights does not query `PIPE_TENSOR_ACTIVE` or `MEM_COPY_UTIL` today; this dashboard reads them directly.\n- Quote `@` labels inside the selector or it is a parse error."},"layout":{"x":0,"y":14412,"w":60,"h":194}}],"scope":{"timeRange":{"start":"now-1h","end":"now"}}}
