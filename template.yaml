"variant":"transparent","layout":{"x":0,"y":10828,"w":60,"h":80},"config":{"content":"# 6. Did it work? Count fast answers, not just output\n\n---"}},{"type":"markdown","variant":"transparent","config":{"content":"**Throughput** counts tokens produced. **Goodput** counts requests answered within the latency target. Bigger batches raise throughput, but past a point every request slows down. **Raise the batch ceiling until goodput stops improving.**"},"layout":{"x":0,"y":10908,"w":60,"h":100}},{"type":"explore","title":"Throughput: requests completed per second","config":{"queryString":"sum without (\"@resource.k8s.namespace.name\", \"@resource.k8s.deployment.name\", \"@resource.host.type\") (label_replace(label_replace(sum by (\"@resource.k8s.namespace.name\") (rate({\"vllm:request_success_total\", \"@resource.k8s.cluster.name\"=\"${ClusterName}\", \"@resource.k8s.deployment.name\"!=\"\"}[5m])), \"Team\", \"$1\", \"@resource.k8s.namespace.name\", \"(.+)\"), \"instance\", \"$1\", \"@resource.host.type\", \"(.+)\"))","queryLanguage":"promql","visualization":"line","autoRun":true,"promqlQueryOptions":{"step":300},"chartOptions":{"view":"line","plotOptions":{"legend":{"show":true,"position":"bottom"},"yAxis":[{"min":0,"title":"requests/s"}]}}},"layout":{"x":0,"y":11008,"w":30,"h":380}},{"type":"explore","title":"Goodput: requests/s answered within 2 s","config":{"queryString":"sum without (\"@resource.k8s.namespace.name\", \"@resource.k8s.deployment.name\", \"@resource.host.type\") (label_replace(label_replace((histogram_fraction(0, 2.0, sum by (\"@resource.k8s.namespace.name\") (rate({\"vllm:time_to_first_token_seconds\", \"@resource.k8s.cluster.name\"=\"${ClusterName}\", \"@resource.k8s.deployment.name\"!=\"\"}[5m])))) * on (\"@resource.k8s.namespace.name\") (sum by (\"@resource.k8s.namespace.name\") (rate({\"vllm:request_success_total\", \"@resource.k8s.cluster.name\"=\"${ClusterName}\", \"@resource.k8s.deployment.name\"!=\"\"}[5m]))), \"Team\", \"$1\", \"@resource.k8