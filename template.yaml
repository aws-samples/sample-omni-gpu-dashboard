*Find your row from your own latency target, then read across.**\n\n| Breaching | Bound by | Buy |\n|---|---|---|\n| Inter-token latency | decode, **memory bandwidth** | read speed per GPU |\n| Time to first token | prefill, **tensor cores** | matrix throughput (check prefix caching first) |\n| Weights + cache don't fit | **memory capacity** | GB per GPU |\n\n| GPU | Memory | Read speed |\n|---|---|---|\n| L4 | 24 GB | 300 GB/s |\n| A10G | 24 GB | 600 GB/s |\n| L40S | 48 GB | 864 GB/s |\n| A100 | 40 GB | 1,555 GB/s |\n| H100 | 80 GB | 3,350 GB/s |\n| H200 | 141 GB | 4,800 GB/s |\n\n**Twice the bandwidth, roughly twice the tokens per second.** An L40S has more tensor cores than an H100 and a quarter of the bandwidth. Size fit with AWS's 22 GiB usable for L4/A10G. Tensor cores are GPU units, not host vCPUs: the `48` in `p5.48xlarge` is vCPUs, the instance holds 8 GPUs."},"layout":{"x":0,"y":8344,"w":60,"h":506}},{"type":"explore","title":"Prompt tokens p50 / p95 (input length)","config":{"queryString":"sum without (\"@resource.k8s.namespace.name\", \"@resource.k8s.deployment.name\", \"@resource.host.type\") (label_replace(label_replace(label_replace(histogram_quantile(0.5, sum by (\"@resource.k8s.namespace.name\") (rate({\"vllm:request_prompt_tokens\", \"@resource.k8s.cluster.name\"=\"${ClusterName}\", \"@resource.k8s.deployment.name\"!=\"\"}[5m]))), \"q\", \"p50\", \"\", \"\") or label_replace(histogram_quantile(0.95, sum by (\"@resource.k8s.namespace.name\") (rate({\"vllm:request_prompt_tokens\", \"@resource.k8s.cluster.name\"=\"${ClusterName}\", \"@resource.k8s.deployment.name\"!=\"\"}[5m]))), \"q\", \"p95\", \"\", \"\"), \"Team\", \"$1\", \"@resource.k8s.namespace.name\", \"(.+)\"), \"instance\", \"$1\", \"@resource.host.type\", \"(.+)\"))","queryLanguage":"promql","visualization":"line","autoRun":true,"promqlQueryOptions":{"step":300},"chartOptions":{"view":"line","plotOptions":{"legend":{"show":true,"position":"bottom"},"yAxis":[{"min":0,"title":"tokens"}]}}},"d