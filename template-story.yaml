nt":"transparent","layout":{"x":0,"y":1554,"w":60,"h":80},"config":{"content":"# 2. Queue: how full is each batch?\n\n---"}},{"type":"markdown","variant":"transparent","config":{"content":"The model server runs requests in batches. **Running:** requests in the current batch. **Waiting:** requests queued for a slot. **KV cache:** memory holding each conversation in progress. The **batch ceiling** (`max_num_seqs`) caps how many run at once. Batch below the ceiling and nothing waiting: spare capacity. **Batch at the ceiling, a queue, and spare cache: the ceiling is too low.**"},"layout":{"x":0,"y":1634,"w":60,"h":102}},{"type":"explore","title":"Batch and cache settings per team","config":{"queryString":"sum without (\"@resource.k8s.namespace.name\", \"@resource.k8s.deployment.name\", \"@resource.host.type\") (label_replace(label_replace(label_replace(sum without (\"kv_cache_max_concurrency\") (label_replace(sum without (\"kv_cache_size_tokens\") (label_replace(max by (\"@resource.k8s.namespace.name\", \"kv_cache_size_tokens\", \"kv_cache_max_concurrency\") ({\"vllm:cache_config_info\", \"@resource.k8s.cluster.name\"=\"${ClusterName}\", \"@resource.k8s.deployment.name\"!=\"\"}), \"cache_tokens\", \"$1\", \"kv_cache_size_tokens\", \"(.*)\")), \"chats_that_fit_in_cache\", \"$1\", \"kv_cache_max_concurrency\", \"(.*)\")), \"max_num_seqs\", \"24 (dashboard setting)\", \"\", \"\") * on (\"@resource.k8s.namespace.name\") group_left (model_name) (0 * count by (\"@resource.k8s.namespace.name\", model_name) ({\"vllm:num_requests_running\", \"@resource.k8s.cluster.name\"=\"${ClusterName}\", \"@resource.k8s.deployment.name\"!=\"\"}) + 1), \"Team\", \"$1\", \"@resource.k8s.namespace.name\", \"(.+)\"), \"instance\", \"$1\", \"@resource.host.type\", \"(.+)\"))","queryLanguage":"promql","visualization":"table","autoRun":true,"promqlQueryOptions":{"step":300},"chartOptions":{"view":"table","plotOptions":{"showTimeSeriesData":false,"hiddenColumns":["@timestamp","labels","metric","@labe